<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filament Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKcmAx0HuxriusCpQYMqBzGtKulVTOlR8wXFSGIUv3/Nrtzlwkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-color: #ecf0f1;
            --dark-color: #222;
            --text-color: #333;
        }

        body {
            font-family: sans-serif;
            background-color: var(--dark-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-color: #222;
            --dark-color: #ecf0f1;
            --text-color: #eee;
        }

        .container {
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 5px;
            background-color: var(--light-color);
        }

        .navbar {
            background-color: var(--primary-color);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .navbar a:hover {
            background-color: var(--secondary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        .weight-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 5px;
        }

        .weight-indicator.full {
            background-color: green;
        }

        .weight-indicator.medium {
            background-color: orange;
        }

        .weight-indicator.low {
            background-color: red;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: var(--light-color);
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 600px;
        }

        .close {
            color: #fff;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover {
            color: red;
            cursor: pointer;
        }

        input[type="number"],
        input[type="text"],
        select {
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="navbar">
            <a href="#inventory">Inventory</a>
            <a href="#usage">Usage</a>
            <a href="#import">Import</a>
        </div>

        <div id="inventory">
            <h2>Inventory</h2>
            <button id="add-spool-btn">Add Spool</button>
            <table id="filament-table">
                <thead>
                    <tr>
                        <th>Brand</th>
                        <th>Material</th>
                        <th>Color</th>
                        <th>Weight (g)</th>
                        <th>Used (g)</th>
                        <th>Remaining (g)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filament rows will be dynamically added here -->
                </tbody>
            </table>
        </div>

        <div id="usage">
            <h2>Usage</h2>
            <button id="log-usage-btn">Log Usage</button>
        </div>

        <div id="import">
            <h2>Import</h2>
            <input type="file" id="file-input" accept=".3mf">
            <button id="import-btn">Import</button>
        </div>
    </div>

    <div class="modal" id="add-spool-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Filament Spool</h2>
            <label for="brand">Brand:</label>
            <input type="text" id="brand" required><br>
            <label for="material">Material:</label>
            <select id="material"></select><br>
            <label for="color">Color:</label>
            <input type="color" id="color"><br>
            <label for="weight">Weight (g):</label>
            <input type="number" id="weight" required><br>
            <button onclick="submitAddSpool()">Add</button>
        </div>
    </div>

    <div class="modal" id="usage-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Log Usage</h2>
            <label for="usage-amount">Used (g):</label>
            <input type="number" id="usage-amount" required><br>
            <button onclick="submitUsage()">Log</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>
    <script>
        let filaments = []; // Initialize filaments array

        document.addEventListener('DOMContentLoaded', () => {
            loadAll();

            // Get the modal
            var modal = document.getElementById("add-spool-modal");
            var usageModal = document.getElementById("usage-modal");

            // Get the button that opens the modal
            var addSpoolBtn = document.getElementById("add-spool-btn");
            var logUsageBtn = document.getElementById("log-usage-btn");

            // When the user clicks the button, open the modal
            addSpoolBtn.onclick = function() {
                modal.style.display = "block";
            }

            logUsageBtn.onclick = function() {
                usageModal.style.display = "block";
            }

            // Get the button that closes the modal
            var span = document.getElementsByClassName("close")[0];
            var usageSpan = document.getElementsByClassName("close")[1];

            // When the user clicks on <span> (x), close the modal
            span.onclick = function() {
                modal.style.display = "none";
            }

            usageSpan.onclick = function() {
                usageModal.style.display = "none";
            }

            // When the user clicks anywhere outside of the modal, close it
            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
                if (event.target == usageModal) {
                    usageModal.style.display = "none";
                }
            }

            // Keyboard shortcuts
            document.addEventListener('keydown', (event) => {
                if (event.ctrlKey || event.metaKey) {
                    if (event.key === 'k') {
                        addSpoolBtn.click();
                    }
                    if (event.key === 'e') {
                        // Implement export functionality here
                        console.log('Export to Excel not implemented');
                    }
                }
            });
        });

        async function loadAll() {
            try {
                const response = await fetch('/api/filaments');
                filaments = await response.json();
                renderInventory();
            } catch (error) {
                console.error('Error loading filaments:', error);
                showAlert('Error loading filaments. Please check the console.');
            }
        }

        function renderInventory() {
            const tableBody = document.getElementById('filament-table').querySelector('tbody');
            tableBody.innerHTML = ''; // Clear existing rows

            filaments.forEach(filament => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${filament.brand}</td>
                    <td>${filament.material}</td>
                    <td><span style="background-color: #${filament.color}; width: 20px; height: 20px; display: inline-block;"></span></td>
                    <td>${filament.weight}</td>
                    <td>${filament.used}</td>
                    <td>${filament.remaining}</td>
                    <td>
                        <button onclick="openEditModal(${filament.id})">Edit</button>
                        <button onclick="deleteFilament(${filament.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);

                // Weight indicator
                const weightIndicator = document.createElement('span');
                weightIndicator.classList.add('weight-indicator');
                if (filament.remaining <= 20) {
                    weightIndicator.classList.add('low');
                } else if (filament.remaining <= 50) {
                    weightIndicator.classList.add('medium');
                } else {
                    weightIndicator.classList.add('full');
                }
                row.querySelector('td:nth-child(7)').appendChild(weightIndicator);
            });
        }

        function openUsageModal() {
            document.getElementById('usage-modal').style.display = 'block';
        }

        function openAddModal() {
            document.getElementById('add-spool-modal').style.display = 'block';
        }

        function submitAddSpool() {
            const brand = document.getElementById('brand').value;
            const material = document.getElementById('material').value;
            const color = document.getElementById('color').value;
            const weight = parseInt(document.getElementById('weight').value);

            if (!brand || !material || !color || !weight) {
                showAlert('Please fill in all fields.');
                return;
            }

            const newFilament = {
                brand: brand,
                material: material,
                color: color,
                weight: weight,
                used: 0,
                remaining: weight
            };

            fetch('/api/filaments', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(newFilament)
            })
            .then(response => {
                if (response.ok) {
                    showAlert('Filament added successfully.');
                    loadAll();
                    document.getElementById('add-spool-modal').style.display = 'none';
                } else {
                    showAlert('Error adding filament.');
                }
            })
            .catch(error => {
                console.error('Error adding filament:', error);
                showAlert('Error adding filament. Please check the console.');
            });
        }

        function submitUsage() {
            const usageAmount = parseInt(document.getElementById('usage-amount').value);

            if (isNaN(usageAmount) || usageAmount <= 0) {
                showAlert('Please enter a valid usage amount.');
                return;
            }

            const selectedFilamentId = parseInt(document.getElementById('selectedFilamentId').value); // Assuming you'd store the selected filament ID somehow

            if (isNaN(selectedFilamentId)) {
                showAlert('No filament selected.');
                return;
            }

            fetch(`/api/usage/${selectedFilamentId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ amount: usageAmount })
            })
            .then(response => {
                if (response.ok) {
                    showAlert('Usage logged successfully.');
                    loadAll();
                    document.getElementById('usage-modal').style.display = 'none';
                } else {
                    showAlert('Error logging usage.');
                }
            })
            .catch(error => {
                console.error('Error logging usage:', error);
                showAlert('Error logging usage. Please check the console.');
            });
        }

        function showAlert(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Placeholder functions - implement these
        function openEditModal(id) {
            console.log('Edit filament with ID:', id);
        }

        function deleteFilament(id) {
            console.log('Delete filament with ID:', id);
        }

        // Material options
        const materials = ['PLA', 'ABS', 'PETG', 'TPU'];
        const materialSelect = document.getElementById('material');
        materials.forEach(material => {
            const option = document.createElement('option');
            option.value = material;
            option.textContent = material;
            materialSelect.appendChild(option);
        });
    </script>

</body>
</html>
