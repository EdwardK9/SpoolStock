
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FilamentStock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{font-family:Arial;background:#111;color:#eee;margin:40px}
.card{background:#1b1b1b;padding:16px;border-radius:10px;margin-bottom:10px}
button{padding:6px 10px;margin:4px;border-radius:6px;border:none;background:#3b82f6;color:white;cursor:pointer}
input{padding:6px;border-radius:6px;border:1px solid #444;background:#222;color:#fff}
</style>
</head>

<body>

<h1>FilamentStock</h1>

<h3>Scan Spool</h3>
<input id="scan-input" placeholder="Scan FSPOOL-XX" onchange="handleScan()">

<h3>Add Spool</h3>
<input id="brand" placeholder="Brand">
<input id="material" placeholder="Material">
<input id="color" placeholder="Colour">
<button onclick="addSpool()">Add</button>

<h3>Spools</h3>
<div id="spools"></div>

<div id="qrModal" style="display:none">
<h3>QR Code</h3>
<div id="qr"></div>
<button onclick="closeQR()">Close</button>
</div>

<script>

let spools=[]

function render(){
const box=document.getElementById("spools")
box.innerHTML=""

spools.forEach(s=>{
const el=document.createElement("div")
el.className="card"

el.innerHTML=`
<b>${s.brand}</b> ${s.material} ${s.color}<br>
ID: ${s.id}<br>
<button onclick="showQR(${s.id})">QR</button>
<button onclick="logUse(${s.id})">Use</button>
`
box.appendChild(el)
})
}

function addSpool(){

const s={
id:spools.length+1,
brand:document.getElementById("brand").value,
material:document.getElementById("material").value,
color:document.getElementById("color").value
}

spools.push(s)
render()
}

function showQR(id){

document.getElementById("qr").innerHTML=""

new QRCode(document.getElementById("qr"),{
text:`FSPOOL-${id}`,
width:200,
height:200
})

document.getElementById("qrModal").style.display="block"
}

function closeQR(){
document.getElementById("qrModal").style.display="none"
}

function handleScan(){

const code=document.getElementById("scan-input").value

if(!code.startsWith("FSPOOL-")) return

const id=parseInt(code.replace("FSPOOL-",""))

logUse(id)

document.getElementById("scan-input").value=""
}

function logUse(id){

const grams=prompt("Grams used")

if(!grams) return

alert(`Logged ${grams}g for spool ${id}`)
}

render()

</script>

</body>
</html>
