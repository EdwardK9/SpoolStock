
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FilamentStock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#111;color:#eee;margin:30px}
button{padding:6px 10px;margin:4px;border-radius:6px;border:none;background:#3b82f6;color:white;cursor:pointer}
input,select{padding:6px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;margin:4px}
.card{background:#1b1b1b;padding:14px;border-radius:10px;margin-bottom:8px}
</style>
</head>

<body>

<h1>FilamentStock</h1>

<div id="login">
<h3>Login</h3>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">

<h2>Dashboard</h2>
<canvas id="usageChart" height="100"></canvas>

<h2>Inventory</h2>

<select id="sortSelect" onchange="renderInventory()">
<option value="full">Most Full Spools</option>
<option value="empty">Most Empty Spools</option>
<option value="stock_high">Most In Stock</option>
<option value="stock_low">Least In Stock</option>
</select>

<button onclick="clearInventory()">Clear Inventory</button>

<div id="inventory"></div>

<h2>Usage Log</h2>
<button onclick="clearUsage()">Clear Usage</button>
<div id="usage"></div>

<h2>Excel Import</h2>
<input type="file" id="excelFile">

<h2>3MF Import</h2>
<input type="file" id="threeMF">

</div>

<script>

let inventory=[]
let usage=[]

function login(){
const pass=document.getElementById("password").value
if(pass.length>0){
document.getElementById("login").style.display="none"
document.getElementById("app").style.display="block"
}
}

document.getElementById("excelFile").addEventListener("change",importExcel)
document.getElementById("threeMF").addEventListener("change",import3mf)

function importExcel(e){

const reader=new FileReader()

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result)
const wb=XLSX.read(data,{type:'array'})
const sheet=wb.Sheets[wb.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

const filamentLeft=r["Filament Left"]
const totalPurchased=r["Total Purchased"] ?? 1

let spools=Math.ceil(filamentLeft/1000)

let finished=totalPurchased-spools
if(finished<0) finished=0

inventory.push({
brand:r.Brand,
material:r.Material,
colour:r.Colour,
filament:filamentLeft,
spools:spools,
finished:finished
})

})

renderInventory()

}

reader.readAsArrayBuffer(e.target.files[0])
}

function renderInventory(){

const box=document.getElementById("inventory")
box.innerHTML=""

let sorted=[...inventory]

const mode=document.getElementById("sortSelect").value

if(mode=="full") sorted.sort((a,b)=>b.filament%1000 - a.filament%1000)
if(mode=="empty") sorted.sort((a,b)=>a.filament%1000 - b.filament%1000)
if(mode=="stock_high") sorted.sort((a,b)=>b.filament-a.filament)
if(mode=="stock_low") sorted.sort((a,b)=>a.filament-b.filament)

sorted.forEach(s=>{

const el=document.createElement("div")
el.className="card"

el.innerHTML=`
<b>${s.brand}</b> ${s.material} ${s.colour}<br>
Filament Left: ${s.filament}g<br>
Spools In Stock: ${s.spools}<br>
Finished Spools: ${s.finished}
`

box.appendChild(el)

})

}

function clearInventory(){
if(confirm("Clear inventory database?")){
inventory=[]
renderInventory()
}
}

function clearUsage(){
if(confirm("Clear usage log?")){
usage=[]
document.getElementById("usage").innerHTML=""
}
}

async function import3mf(e){

const file=e.target.files[0]
const zip=await JSZip.loadAsync(file)

let grams=null

const tryFiles=[
"Metadata/model_settings.config",
"Metadata/slice_info.config"
]

for(const f of tryFiles){

const obj=zip.file(f)

if(obj){

const txt=await obj.async("text")

let m=txt.match(/filament_used\s*=\s*([0-9.]+)/)
if(!m) m=txt.match(/estimated_weight\s*=\s*([0-9.]+)/)

if(m){
grams=parseFloat(m[1])
break
}

}

}

if(!grams){
alert("No filament weight found in 3MF")
return
}

usage.push({grams:grams,date:new Date()})

renderUsage()
renderChart()

}

function renderUsage(){

const box=document.getElementById("usage")
box.innerHTML=""

usage.forEach(u=>{

const el=document.createElement("div")
el.className="card"

el.innerText=`${u.grams}g used on ${new Date(u.date).toLocaleDateString()}`

box.appendChild(el)

})

}

function renderChart(){

const monthly={}

usage.forEach(u=>{

const m=new Date(u.date).toISOString().slice(0,7)

monthly[m]=(monthly[m]??0)+u.grams

})

const labels=Object.keys(monthly)
const data=Object.values(monthly)

new Chart(document.getElementById("usageChart"),{
type:'bar',
data:{
labels:labels,
datasets:[{label:"Filament Used (g)",data:data}]
}
})

}

</script>

</body>
</html>
